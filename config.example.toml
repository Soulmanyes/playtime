# playtime config: ~/.config/playtime/config.toml

# The history lives in ~/.local/share/playtime/playtime.db and works without
# a server. To also mirror it to one, set an SSH host alias (from
# ~/.ssh/config) here, e.g. "myserver". The key must work without a passphrase
# prompt: the daemon runs ssh in BatchMode. Empty: local only.
ssh_host = ""
# Directory on the server, relative to the SSH user's home.
remote_dir = "playtime"

# Daily copies of the history in ~/.local/share/playtime/backups/; how many
# to keep. 0 turns them off.
backup_keep = 7

# Install new Playtime releases from GitHub by itself, between games.
# Checked once a day. `playtime update` installs one by hand.
auto_update = true

poll_seconds = 10
sync_minutes = 15
# Shorter sessions are not saved.
min_session_seconds = 60

# Steam AppIds never to track or import (tools Steam launches like games, etc.).
ignore_steam_appids = []

# Steam app types whose earlier playtime counts in all time ("game",
# "application", "tool", "demo", ...).
import_steam_types = ["game"]

# Steam games and Prism Launcher Minecraft are found on their own.
# Other games: one [[game]] block each. `process` matches the executable's
# file name exactly; `cmdline` is a regex over the whole command line.
#
# [[game]]
# name = "Some Game"
# process = "somegame.x86_64"
#
# [[game]]
# name = "Some Other Game"
# cmdline = 'OtherGame\.exe'
