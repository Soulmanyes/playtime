# playtime config: ~/.config/playtime/config.toml

# SSH host alias (from ~/.ssh/config) that keeps the history. The key must
# work without a passphrase prompt: the daemon runs ssh in BatchMode.
ssh_host = "oracle"
# Directory on the server, relative to the SSH user's home.
remote_dir = "playtime"

poll_seconds = 10
sync_minutes = 15
# Shorter sessions are not saved.
min_session_seconds = 60

# Steam AppIds never to track or import (tools Steam launches like games, etc.).
ignore_steam_appids = []

# Steam app types whose earlier playtime counts in all time ("game",
# "application", "tool", "demo", ...).
import_steam_types = ["game"]

# Steam games and Prism Launcher Minecraft are found on their own.
# Other games: one [[game]] block each. `process` matches the executable's
# file name exactly; `cmdline` is a regex over the whole command line.
#
# [[game]]
# name = "Some Game"
# process = "somegame.x86_64"
#
# [[game]]
# name = "Some Other Game"
# cmdline = 'OtherGame\.exe'
